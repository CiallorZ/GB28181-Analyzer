name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 构建发布制品
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run budget
          cd dist
          zip -qr "../../gb28181-analyzer-frontend-${GITHUB_REF_NAME}.zip" .

      - name: 打包源码
        run: |
          git archive --format=tar.gz \
            --prefix="gb28181-analyzer-${GITHUB_REF_NAME}/" \
            -o "gb28181-analyzer-${GITHUB_REF_NAME}.tar.gz" HEAD

      - name: 暂存通用发布文件
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          if-no-files-found: error
          path: |
            gb28181-analyzer-frontend-${{ github.ref_name }}.zip
            gb28181-analyzer-${{ github.ref_name }}.tar.gz

  windows:
    name: 构建与验证 Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建便携包
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller==6.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-windows.ps1
      - name: 验证 ZIP 解压与启动
        run: python scripts/smoke-windows.py "build/windows/gb28181-analyzer-windows-x64-${{ github.ref_name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: build/windows/gb28181-analyzer-windows-x64-${{ github.ref_name }}.zip

  publish:
    name: 发布版本
    runs-on: ubuntu-latest
    needs: [package, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: 生成校验和和说明
        run: |
          (cd artifacts && sha256sum gb28181-analyzer-*.zip gb28181-analyzer-*.tar.gz > SHA256SUMS.txt)
          awk -v tag="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; found = index($0, "[" tag "]") != 0; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/gb28181-analyzer-frontend-${{ github.ref_name }}.zip
            artifacts/gb28181-analyzer-windows-x64-${{ github.ref_name }}.zip
            artifacts/gb28181-analyzer-${{ github.ref_name }}.tar.gz
            artifacts/SHA256SUMS.txt
