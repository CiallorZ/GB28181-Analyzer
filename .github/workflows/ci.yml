name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          cd backend
          pip install -r requirements.txt

      - name: 安装外部工具
        run: |
          # 端到端用例（tests/test_e2e_fixtures.py）需要 tshark，
          # 没有时会自动 skip —— 但那样等于没测，所以这里装上。
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark
          tshark --version | head -1

      - name: 语法检查
        run: |
          cd backend
          python -m compileall -q app

      - name: 单元测试
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: cd frontend && npm ci

      - name: 构建
        run: cd frontend && npm run build

      - name: 检查构建产物
        run: |
          test -f frontend/dist/index.html || (echo "构建产物缺失" && exit 1)
          echo "构建产物大小："
          du -sh frontend/dist

  hygiene:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 禁止提交敏感文件
        run: |
          fail=0
          if git ls-files | grep -q 'ai_config.json'; then
            echo "::error::ai_config.json 不应入库（含 API Key）"; fail=1
          fi
          if git ls-files | grep -qE '\.(db|db-wal|db-shm)$'; then
            echo "::error::数据库文件不应入库"; fail=1
          fi
          if git ls-files | grep -qE '^data/(uploads|rebuilt)/'; then
            echo "::error::抓包与视频文件不应入库"; fail=1
          fi
          if git ls-files | grep -q 'node_modules/'; then
            echo "::error::node_modules 不应入库"; fail=1
          fi
          exit $fail

      - name: 检查大文件
        run: |
          # 单个文件超过 5MB 给出警告（品牌资源与样例图除外）
          found=0
          while IFS= read -r f; do
            case "$f" in
              frontend/public/brand/*|docs/samples/*) continue ;;
            esac
            sz=$(wc -c < "$f" | tr -d ' ')
            if [ "$sz" -gt 5242880 ]; then
              echo "::warning file=$f::文件较大（$((sz/1024/1024))MB），确认是否应入库"
              found=1
            fi
          done <<< "$(git ls-files)"
          echo "大文件检查完成（warning=$found，不阻断）"
