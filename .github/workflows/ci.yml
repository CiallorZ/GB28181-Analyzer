name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 后端静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装开发依赖
        run: pip install -r backend/requirements-dev.txt

      - name: ruff
        working-directory: backend
        run: ruff check app tests

  unit:
    name: 后端单元测试（无外部工具）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装开发依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 语法检查
        working-directory: backend
        run: python -m compileall -q app

      - name: 单元测试
        working-directory: backend
        # 没有 tshark 时 e2e 自动 skip；真正需要外部工具的用例在 integration job 跑满
        run: python -m pytest tests/ -q

  integration:
    name: 端到端与覆盖率（tshark + ffmpeg）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装开发依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 安装外部工具
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean true" \
            | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tshark ffmpeg
          tshark --version | head -1
          ffmpeg -version | head -1

      - name: 全量测试 + 覆盖率门槛
        working-directory: backend
        run: |
          python -m pytest tests/ -q \
            --cov=app --cov-report=term \
            --cov-fail-under=70

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: frontend

      - name: 静态检查
        run: npm run lint
        working-directory: frontend

      - name: 单元测试
        run: npm run test
        working-directory: frontend

      - name: 构建
        run: npm run build
        working-directory: frontend

      - name: 首屏 JS 预算
        run: npm run budget
        working-directory: frontend

      - name: 检查构建产物
        run: |
          test -f frontend/dist/index.html || (echo "构建产物缺失" && exit 1)
          du -sh frontend/dist

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: 校验 compose 配置
        run: docker compose config -q

      - name: 构建后端镜像
        run: docker build -f backend/Dockerfile -t gb28181-analyzer-backend:ci .

      - name: 构建前端镜像
        run: docker build -f frontend/Dockerfile -t gb28181-analyzer-frontend:ci .

  hygiene:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 禁止提交敏感文件与构建产物
        shell: bash
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            case "$f" in
              ai_config.json|*/ai_config.json)
                echo "::error file=$f::ai_config.json 含 API Key，不应入库"; fail=1 ;;
              *.db|*.db-wal|*.db-shm)
                echo "::error file=$f::数据库文件不应入库"; fail=1 ;;
              data/uploads/*|data/rebuilt/*)
                echo "::error file=$f::抓包与重建产物不应入库"; fail=1 ;;
              node_modules/*|*/node_modules/*)
                echo "::error file=$f::node_modules 不应入库"; fail=1 ;;
              frontend/dist/*)
                echo "::error file=$f::前端构建产物不应入库"; fail=1 ;;
              .env|*/.env)
                echo "::error file=$f::.env 不应入库"; fail=1 ;;
            esac
          done < <(git ls-files -z)
          exit $fail

      - name: 检查大文件
        shell: bash
        run: |
          while IFS= read -r -d '' f; do
            case "$f" in
              frontend/public/brand/*|docs/samples/*|*.pcap|*.pcapng) continue ;;
            esac
            sz=$(wc -c < "$f" | tr -d ' ')
            if [ "$sz" -gt 5242880 ]; then
              echo "::warning file=$f::文件较大（$((sz/1024/1024))MB），确认是否应入库"
            fi
          done < <(git ls-files -z)
          echo "大文件检查完成（仅告警，不阻断）"
