name: Windows portable build

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true

permissions:
  contents: read

jobs:
  windows:
    name: 构建与验证 Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 构建便携包
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller==6.19.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build-windows.ps1
      - name: 验证 ZIP 解压与启动
        shell: pwsh
        run: |
          $archive = Get-Item build/windows/gb28181-analyzer-windows-x64-v*.zip
          python scripts/smoke-windows.py $archive.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: error
          path: build/windows/gb28181-analyzer-windows-x64-v*.zip
