[package]
name = "gb28181-desktop"
version = "1.3.1"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
