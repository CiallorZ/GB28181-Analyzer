services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATA_DIR: /app/data
      # 对外部署时务必显式设置，例如 analyzer.example.com
      # ALLOWED_HOSTS: analyzer.example.com
    ports:
      - "8788:8788"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
