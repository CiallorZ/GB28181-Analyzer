services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATA_DIR: /app/data
      # 默认仅通过本机前端代理访问。对外开放前必须配置认证、TLS 和明确的 Host 白名单。
      # ALLOWED_HOSTS: analyzer.example.com
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
